    #launcher{
      display:flex;
      flex-direction:column;
      align-items:center;
      width:100%;
      max-width:600px;
      gap:20px;
    }
    #launcher img{
      width:180px;
      display:block;
      filter:drop-shadow(0 0 16px rgba(34,197,94,.9)) drop-shadow(0 0 36px rgba(34,197,94,.5));
    }
    .title-card{
      width:100%;
      background:rgba(6,14,6,.88);
      backdrop-filter:blur(24px);
      border:1px solid rgba(34,197,94,.35);
      border-radius:20px;
      padding:36px 36px 24px;
      text-align:center;
      box-shadow:0 0 40px rgba(34,197,94,.1),0 20px 60px rgba(0,0,0,.6);
    }
    .sp-title{
      font-family:"Inter",sans-serif;
      font-size:22px;
      font-weight:800;
      letter-spacing:.2em;
      color:#22C55E;
      text-transform:uppercase;
      margin-bottom:6px;
      text-shadow:0 0 20px rgba(34,197,94,.6);
    }
    .sp-sub{
      font-size:11px;
      color:rgba(255,255,255,.35);
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    .btns{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .lbtn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 20px;
      border-radius:13px;
      background:rgba(12,20,12,.92);
      border:1px solid rgba(255,255,255,.08);
      text-decoration:none;
      font-family:"DM Sans",sans-serif;
      font-size:15px;
      font-weight:700;
      color:#e5e7eb;
      transition:border-color .2s,box-shadow .2s,transform .15s;
    }
    .lbtn:hover{
      border-color:rgba(34,197,94,.45);
      box-shadow:0 0 20px rgba(34,197,94,.2);
      transform:translateY(-2px);
