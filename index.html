<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorecard Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,::before,::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;min-height:100%;font-family:'Inter',Arial,sans-serif;color:#E5E7EB;}
    body{
      display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
      min-height:100vh;padding:30px 16px 40px;
      background:#050e05 url('bg.jpg') center center/cover no-repeat fixed;
    }
    body::before{
      content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:rgba(0,0,0,0.38);
    }
    .wrap{
      position:relative;z-index:1;display:flex;flex-direction:column;
      align-items:center;width:92%;max-width:660px;
    }
    .logo{
      width:240px;height:240px;object-fit:contain;margin-bottom:-16px;
      position:relative;z-index:2;
      filter:drop-shadow(0 0 16px rgba(34,197,94,0.9)) drop-shadow(0 0 36px rgba(34,197,94,0.5)) drop-shadow(0 0 70px rgba(34,197,94,0.2));
    }
    .title-card{
      width:100%;background:rgba(6,14,6,0.85);backdrop-filter:blur(24px);
      border:1px solid rgba(34,197,94,0.35);border-radius:24px;
      padding:44px 40px 28px;text-align:center;margin-bottom:20px;
      box-shadow:0 0 40px rgba(34,197,94,0.12),0 20px 60px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .title{
      font-size:21px;font-weight:800;letter-spacing:0.2em;color:#22C55E;
      text-transform:uppercase;margin-bottom:8px;
      text-shadow:0 0 20px rgba(34,197,94,0.6),0 0 40px rgba(34,197,94,0.3);
    }
    .subtitle{font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:0.16em;text-transform:uppercase;}
    .course-card{
      width:100%;background:rgba(6,14,6,0.85);backdrop-filter:blur(24px);
      border:1px solid rgba(34,197,94,0.25);border-radius:20px;
      padding:22px 28px;margin-bottom:16px;
      box-shadow:0 0 30px rgba(34,197,94,0.08),0 10px 40px rgba(0,0,0,0.5);
    }
    .btn{
      display:flex;align-items:center;justify-content:space-between;
      width:100%;padding:15px 18px;margin-bottom:10px;border-radius:12px;
      text-decoration:none;font-family:'Inter',Arial,sans-serif;font-size:15px;font-weight:700;
      background:rgba(12,20,12,0.92);border:1px solid rgba(255,255,255,0.07);
      cursor:pointer;transition:transform 0.22s ease,box-shadow 0.22s ease,border-color 0.22s ease;
      backdrop-filter:blur(8px);
    }
    .btn:last-child{margin-bottom:0;}
    .btn-left{display:flex;align-items:center;gap:12px;}
    .btn-icon{
      width:38px;height:38px;border-radius:9px;display:flex;align-items:center;
      justify-content:center;font-size:18px;flex-shrink:0;transition:transform 0.22s;
    }
    .btn-arrow{font-size:16px;opacity:0.4;transition:transform 0.22s,opacity 0.22s;}
    .btn:hover{transform:translateY(-2px);background:rgba(18,28,18,0.95);}
    .btn:hover .btn-arrow{transform:translateX(5px);opacity:1;}
    .btn:hover .btn-icon{transform:scale(1.1);}
    .btn-green{color:#22C55E;}
    .btn-green .btn-icon{background:rgba(34,197,94,0.13);}
    .btn-green:hover{border-color:rgba(34,197,94,0.5);box-shadow:0 0 20px rgba(34,197,94,0.25),0 6px 24px rgba(0,0,0,0.5);}
    .btn-blue{color:#38BDF8;}
    .btn-blue .btn-icon{background:rgba(56,189,248,0.13);}
    .btn-blue:hover{border-color:rgba(56,189,248,0.5);box-shadow:0 0 20px rgba(56,189,248,0.22),0 6px 24px rgba(0,0,0,0.5);}
    .btn-yellow{color:#FACC15;}
    .btn-yellow .btn-icon{background:rgba(250,204,21,0.1);}
    .btn-yellow:hover{border-color:rgba(250,204,21,0.5);box-shadow:0 0 20px rgba(250,204,21,0.22),0 6px 24px rgba(0,0,0,0.5);}
    .btn-red{color:#f87171;}
    .btn-red .btn-icon{background:rgba(239,68,68,0.13);}
    .btn-red:hover{border-color:rgba(239,68,68,0.5);box-shadow:0 0 20px rgba(239,68,68,0.22),0 6px 24px rgba(0,0,0,0.5);}
    .footer{
      margin-top:24px;font-size:12px;color:rgba(255,255,255,0.22);
      display:flex;align-items:center;gap:10px;letter-spacing:0.03em;
    }
    .footer a{color:rgba(34,197,94,0.55);text-decoration:none;font-weight:600;transition:color 0.2s;}
    .footer a:hover{color:#22C55E;}
    @media(max-width:560px){
      .logo{width:180px;height:180px;}
      .title-card,.course-card{padding:32px 16px 22px;border-radius:16px;}
      .title{font-size:16px;}
      .btn{font-size:14px;padding:13px 14px;}
      .btn-icon{width:32px;height:32px;font-size:16px;}
    }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="logo.png" alt="Scorecard Pro" class="logo" id="sp-logo">
      <div class="title-card">
        <div class="title">Tournament Control Panel</div>div>
        <div class="subtitle">Live Scores.&nbsp; Real Time.&nbsp; Real Impact.</div>div>
      </div>div>
      <div class="course-card">
        <a href="scorecard.html" class="btn btn-green">
          <div class="btn-left"><div class="btn-icon">&#9971;</div>div><span>Open Scorecard</span></div>div>
        <span class="btn-arrow">&#8594;</span>
        </a>a>
      <a href="#" class="btn btn-blue">
      <div class="btn-left"><div class="btn-icon">&#127942;</div>div><span>View Leaderboard</span></div>div>
      <span class="btn-arrow">&#8594;</span>
      </a>a>
      <a href="#" class="btn btn-yellow">
      <div class="btn-left"><div class="btn-icon">&#9881;&#65039;</div>div><span>Event Manager</span></div>div>
      <span class="btn-arrow">&#8594;</span>
      </a>a>
      <a href="league.html" class="btn btn-red">
      <div class="btn-left"><div class="btn-icon">&#9971;</div>div><span>Golf League</span></div>div>
      <span class="btn-arrow">&#8594;</span>
      </a>a>
      </div>div>
    <div class="footer">
    Powered by&nbsp;<a href="https://verotech.ai" target="_blank">VeroTech.AI</a>a>&nbsp;|&nbsp;314-834-7774
    </div>div>
    </div>div>
  </body>
</html>html></span></span>
  </body>
  </style></title>
  </head>
