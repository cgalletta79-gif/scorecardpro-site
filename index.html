<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorecard Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"DM Sans",Inter,sans-serif;
      min-height:100vh;
      background:#0a1a0a url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?w=1920&q=80') center 40%/cover no-repeat;
      color:#e5e7eb;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 18px;
      position:relative;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(0,8,2,0.72);
      pointer-events:none;
      z-index:0;
    }
    .wrap{
      position:relative;
      z-index:1;
      width:min(680px,100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:20px;
    }
    .logo{
      width:240px;
      max-width:62vw;
      text-align:center;
      background:rgb(15,18,16);
      border-radius:6px;
      overflow:hidden;
    }
    .logo img{width:100%;height:auto;display:block;}
    .title-card{
      width:100%;
      border:1px solid rgba(34,197,94,.3);
      background:rgba(8,24,10,.82);
      border-radius:18px;
      padding:22px 32px;
      text-align:center;
      box-shadow:0 0 40px rgba(34,197,94,.1);
    }
    .title{font-size:26px;font-weight:800;letter-spacing:.22em;color:#63d878;text-transform:uppercase;margin-bottom:8px;}
    .subtitle{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.16em;text-transform:uppercase;}
    .course-card{
      width:100%;
      background:rgba(8,24,10,.82);
      border:1px solid rgba(34,197,94,.2);
      border-radius:18px;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:6px;
      box-shadow:0 0 40px rgba(34,197,94,.07);
    }
    .btn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      text-decoration:none;
      padding:16px 18px;
      border-radius:12px;
      background:rgba(10,22,10,.80);
      border:1px solid rgba(255,255,255,.07);
      color:#e5e7eb;
      font-weight:700;
      font-size:15px;
      transition:transform .2s,border-color .2s,box-shadow .2s;
    }
    .btn:hover{transform:translateY(-2px);border-color:rgba(34,197,94,.45);box-shadow:0 0 20px rgba(34,197,94,.18);}
    .btn-left{display:flex;align-items:center;gap:14px;}
    .btn-icon{width:42px;height:42px;border-radius:9px;background:rgba(34,197,94,.15);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
    .btn-green{color:#22c55e}
    .btn-blue{color:#60a5fa}
    .btn-yellow{color:#facc15}
    .btn-red{color:#ef4444}
    .btn-arrow{font-size:18px;color:rgba(255,255,255,.4)}
    .footer{font-size:13px;color:rgba(255,255,255,.35);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
    .footer a{color:rgba(34,197,94,.75);text-decoration:none;font-weight:700}
    @media(max-width:520px){
      body{padding:22px 12px}
      .title-card{padding:20px 18px}
      .title{font-size:20px;letter-spacing:.16em}
      .btn{padding:14px 14px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo" aria-label="Scorecard Pro"><img src="logo.png" alt="Scorecard Pro"></div>
    <div class="title-card">
      <div class="title">Tournament Control Panel</div>
      <div class="subtitle">Live Scores. Real Time. Real Impact.</div>
    </div>
    <div class="course-card">
      <a class="btn btn-green" href="scorecard.html">
        <div class="btn-left"><div class="btn-icon">&#x26F3;</div><span>Open Scorecard</span></div>
        <span class="btn-arrow">&#x2192;</span>
      </a>
      <a class="btn btn-blue" href="scorecard.html">
        <div class="btn-left"><div class="btn-icon">&#x1F3C6;</div><span>View Leaderboard</span></div>
        <span class="btn-arrow">&#x2192;</span>
      </a>
      <a class="btn btn-yellow" href="scorecard.html">
        <div class="btn-left"><div class="btn-icon">&#x2699;</div><span>Event Manager</span></div>
        <span class="btn-arrow">&#x2192;</span>
      </a>
      <a class="btn btn-red" href="league.html">
        <div class="btn-left"><div class="btn-icon">&#x26F3;</div><span>Golf League</span></div>
        <span class="btn-arrow">&#x2192;</span>
      </a>
    </div>
    <div class="footer">
      Powered by <a href="https://verotech.ai" target="_blank" rel="noopener">VeroTech.AI</a>
      <span>|</span><span>314-834-7774</span>
    </div>
  </div>
</body>
</html>
