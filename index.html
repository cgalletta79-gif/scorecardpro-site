<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorecard Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:"DM Sans",sans-serif;
      min-height:100vh;
      background:#050e05 url('bg.jpg') center/cover no-repeat fixed;
      color:#e5e7eb;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 16px;
    }
    #launcher{
      display:flex;
      flex-direction:column;
      align-items:center;
      width:100%;
      max-width:660px;
      gap:18px;
    }
    #launcher img{
      width:200px;
      display:block;
      filter:drop-shadow(0 0 18px rgba(34,197,94,.9)) drop-shadow(0 0 40px rgba(34,197,94,.5));
      margin-bottom:4px;
    }
    .title-card{
      width:100%;
      background:rgba(6,14,6,.85);
      backdrop-filter:blur(24px);
      border:1px solid rgba(34,197,94,.18);
      border-radius:14px;
      padding:28px 32px 22px;
      text-align:center;
    }
    .title-card h1{
      font-size:clamp(1.15rem,3.5vw,1.6rem);
      font-weight:800;
      letter-spacing:.18em;
      color:#86efac;
      text-transform:uppercase;
      margin-bottom:8px;
    }
    .title-card p{
      font-size:.78rem;
      letter-spacing:.18em;
      color:#6b7280;
      text-transform:uppercase;
    }
    .menu-card{
      width:100%;
      background:rgba(6,14,6,.85);
      backdrop-filter:blur(24px);
      border:1px solid rgba(34,197,94,.18);
      border-radius:14px;
      padding:14px 16px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .menu-btn{
      display:flex;
      align-items:center;
      gap:14px;
      padding:14px 18px;
      border-radius:10px;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.07);
      cursor:pointer;
      text-decoration:none;
      transition:background .2s;
    }
    .menu-btn:hover{background:rgba(255,255,255,.08);}
    .btn-icon{
      width:40px;height:40px;
      border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      font-size:1.3rem;
      flex-shrink:0;
    }
    .btn-label{
      font-size:1rem;
      font-weight:700;
      letter-spacing:.04em;
      flex:1;
    }
    .btn-arrow{
      font-size:.9rem;
      opacity:.5;
      flex-shrink:0;
    }
    .green .btn-icon{background:rgba(34,197,94,.18);}
    .green .btn-label{color:#4ade80;}
    .blue .btn-icon{background:rgba(59,130,246,.18);}
    .blue .btn-label{color:#60a5fa;}
    .yellow .btn-icon{background:rgba(234,179,8,.18);}
    .yellow .btn-label{color:#facc15;}
    .red .btn-icon{background:rgba(239,68,68,.18);}
    .red .btn-label{color:#f87171;}
    footer{
      font-size:.75rem;
      color:#4b5563;
      text-align:center;
      margin-top:4px;
      letter-spacing:.04em;
    }
    footer a{color:#6b7280;text-decoration:none;}
    footer a:hover{color:#9ca3af;}
  </style>
</head>
<body>
  <div id="launcher">
    <img src="logo.png" alt="Scorecard Pro" id="sp-logo">
    <div class="title-card">
      <h1>Tournament Control Panel</h1>
      <p>Live Scores.&nbsp; Real Time.&nbsp; Real Impact.</p>
    </div>
    <div class="menu-card">
      <a href="scorecard.html" class="menu-btn green">
        <div class="btn-icon">⛳</div>
        <span class="btn-label">Open Scorecard</span>
        <span class="btn-arrow">→</span>
      </a>
      <a href="#" class="menu-btn blue">
        <div class="btn-icon">🏆</div>
        <span class="btn-label">View Leaderboard</span>
        <span class="btn-arrow">→</span>
      </a>
      <a href="#" class="menu-btn yellow">
        <div class="btn-icon">⚙️</div>
        <span class="btn-label">Event Manager</span>
        <span class="btn-arrow">→</span>
      </a>
      <a href="league.html" class="menu-btn red">
        <div class="btn-icon">⛳</div>
        <span class="btn-label">Golf League</span>
        <span class="btn-arrow">→</span>
      </a>
    </div>
    <footer>Powered by&nbsp;<a href="#">VeroTech.AI</a>&nbsp;|&nbsp;314-834-7774</footer>
  </div>
  <script>
    (function(){
      var img=document.getElementById('sp-logo');
      if(!img)return;
      function process(){
        var c=document.createElement('canvas');
        c.width=img.naturalWidth;c.height=img.naturalHeight;
        var x=c.getContext('2d');
        x.drawImage(img,0,0);
        var d=x.getImageData(0,0,c.width,c.height);
        var px=d.data;
        for(var i=0;i<px.length;i+=4){
          var b=(px[i]+px[i+1]+px[i+2])/3;
          if(b<25){px[i+3]=0;}
          else if(b<50){px[i+3]=Math.round((b-25)/25*255);}
        }
        x.putImageData(d,0,0);
        img.src=c.toDataURL('image/png');
      }
      if(img.complete&&img.naturalWidth){process();}
      else{img.onload=process;}
    })();
  </script>
</body>
</html>
