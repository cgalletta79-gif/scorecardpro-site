<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorecard Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",Inter,sans-serif;min-height:100vh;background:#050e05;color:#e5e7eb;display:flex;align-items:center;justify-content:center;padding:32px 18px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,rgba(34,197,94,.16),transparent 32%),linear-gradient(180deg,rgba(5,14,5,.7),rgba(0,0,0,.92));pointer-events:none}
.wrap{position:relative;width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{width:220px;max-width:70vw;text-align:center;font-weight:900;line-height:.9;letter-spacing:.03em;text-transform:uppercase;color:#f3f4f6;text-shadow:0 0 26px rgba(34,197,94,.45)}
.logo .sp{display:block;font-size:64px;color:#8dc63f;font-style:italic}
.logo .name{display:block;font-size:26px}
.logo .pro{display:block;font-size:20px;color:#8dc63f;letter-spacing:.18em;margin-top:4px}
.title-card{width:100%;border:1px solid rgba(34,197,94,.35);background:rgba(6,20,9,.9);border-radius:20px;padding:30px 28px;text-align:center;box-shadow:0 0 45px rgba(34,197,94,.12)}
.title{font-size:24px;font-weight:800;letter-spacing:.24em;color:#63d878;text-transform:uppercase;margin-bottom:8px}
.subtitle{font-size:12px;color:rgba(255,255,255,.45);letter-spacing:.18em;text-transform:uppercase}
.course-card{width:100%;display:flex;flex-direction:column;gap:12px}
.btn{width:100%;display:flex;align-items:center;justify-content:space-between;text-decoration:none;padding:18px 20px;border-radius:13px;background:rgba(12,20,12,.92);border:1px solid rgba(255,255,255,.08);color:#e5e7eb;font-weight:700;transition:transform .2s,border-color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);border-color:rgba(34,197,94,.45);box-shadow:0 0 20px rgba(34,197,94,.18)}
.btn-left{display:flex;align-items:center;gap:14px}.btn-icon{width:40px;height:40px;border-radius:9px;background:rgba(34,197,94,.13);display:flex;align-items:center;justify-content:center;font-size:20px}.btn-green{color:#22c55e}.btn-blue{color:#60a5fa}.btn-yellow{color:#facc15}.btn-red{color:#ef4444}.btn-arrow{font-size:20px;color:rgba(255,255,255,.45)}
.footer{font-size:13px;color:rgba(255,255,255,.35);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.footer a{color:rgba(34,197,94,.75);text-decoration:none;font-weight:700}
@media(max-width:520px){body{padding:22px 12px}.logo .sp{font-size:50px}.title-card{padding:26px 20px}.title{font-size:20px;letter-spacing:.18em}.btn{padding:15px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" aria-label="Scorecard Pro"><span class="sp">SP</span><span class="name">Scorecard</span><span class="pro">Pro</span></div>
  <div class="title-card">
    <div class="title">Tournament Control Panel</div>
    <div class="subtitle">Live Scores. Real Time. Real Impact.</div>
  </div>
  <div class="course-card">
    <a href="scorecard.html" class="btn btn-green"><div class="btn-left"><div class="btn-icon">&#9971;</div><span>Open Scorecard</span></div><span class="btn-arrow">&#8594;</span></a>
    <a href="scorecard.html" class="btn btn-blue"><div class="btn-left"><div class="btn-icon">&#127942;</div><span>View Leaderboard</span></div><span class="btn-arrow">&#8594;</span></a>
    <a href="scorecard.html" class="btn btn-yellow"><div class="btn-left"><div class="btn-icon">&#9881;</div><span>Event Manager</span></div><span class="btn-arrow">&#8594;</span></a>
    <a href="league.html" class="btn btn-red"><div class="btn-left"><div class="btn-icon">&#9971;</div><span>Golf League</span></div><span class="btn-arrow">&#8594;</span></a>
  </div>
  <div class="footer">Powered by <a href="https://verotech.ai" target="_blank" rel="noopener">VeroTech.AI</a><span>|</span><span>314-834-7774</span></div>
</div>
</body>
</html>
