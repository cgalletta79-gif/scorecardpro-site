<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorecard Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"DM Sans",Inter,sans-serif;
      min-height:100vh;
      background:#0d1a0d url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?w=1920&q=80') center bottom/cover no-repeat fixed;
      color:#e5e7eb;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 24px;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(0,10,0,0.65);
      pointer-events:none;
      z-index:0;
    }
    .wrap{
      position:relative;
      z-index:1;
      width:min(1000px,92%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:20px;
    }
    .logo{
      width:220px;
      max-width:55vw;
      text-align:center;
      background:rgb(14,17,15);
      border-radius:8px;
      overflow:hidden;
    }
    .logo img{width:100%;height:auto;display:block;}
    .title-card{
      width:100%;
      border:1px solid rgba(34,197,94,.3);
      background:rgba(8,22,10,.88);
      border-radius:18px;
      padding:28px 40px;
      text-align:center;
      box-shadow:0 0 50px rgba(34,197,94,.1);
    }
    .title{
      font-size:clamp(20px,2.8vw,36px);
      font-weight:800;
      letter-spacing:.22em;
      color:#63d878;
      text-transform:uppercase;
      margin-bottom:10px;
      white-space:nowrap;
    }
    .subtitle{
      font-size:13px;
      color:rgba(255,255,255,.45);
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .course-card{
      width:100%;
      background:rgba(8,22,10,.88);
      border:1px solid rgba(34,197,94,.18);
      border-radius:18px;
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:8px;
      box-shadow:0 0 50px rgba(34,197,94,.07);
    }
    .btn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      text-decoration:none;
      padding:20px 24px;
      border-radius:13px;
      background:rgba(10,20,10,.85);
      border:1px solid rgba(255,255,255,.07);
      color:#e5e7eb;
      font-weight:700;
      font-size:16px;
      transition:transform .2s,border-color .2s,box-shadow .2s;
    }
    .btn:hover{transform:translateY(-2px);border-color:rgba(34,197,94,.45);box-shadow:0 0 24px rgba(34,197,94,.2);}
    .btn-left{display:flex;align-items:center;gap:16px;}
    .btn-icon{
      width:46px;
      height:46px;
      border-radius:10px;
      background:rgba(34,197,94,.15);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      flex-shrink:0;
    }
    .btn-green{color:#22c55e}
    .btn-blue{color:#60a5fa}
    .btn-yellow{color:#facc15}
    .btn-red{color:#ef4444}
    .btn-arrow{font-size:20px;color:rgba(255,255,255,.4)}
    .footer{
      font-size:13px;
      color:rgba(255,255,255,.35);
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }
    .footer a{color:rgba(34,197,94,.8);text-decoration:none;font-weight:700}
    @media(max-width:600px){
      body{padding:24px 14px}
      .title{font-size:18px;letter-spacing:.14em;white-space:normal}
      .title-card{padding:22px 20px}
      .btn{padding:16px 16px;font-size:14px}
      .btn-icon{width:40px;height:40px;font-size:20px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo" aria-label="Scorecard Pro"><img src="logo.png" alt="Scorecard Pro"></div>
    <div class="title-card">
      <div class="title">Tournament Control Panel</div>
      <div class="subtitle">Live Scores. Real Time. Real Impact.</div>
    </div>
    <div class="course-card">
      <a class="btn btn-green" href="scorecard.html">
        <div class="btn-left"><div class="btn-icon">&#x26F3;</div><span>Open Scorecard</span></div>
        <span class="btn-arrow">&#x2192;</span>
      </a>
      <a class="btn btn-blue" href="scorecard.html">
        <div class="btn-left"><div class="btn-icon">&#x1F3C6;</div><span>View Leaderboard</span></div>
        <span class="btn-arrow">&#x2192;</span>
      </a>
      <a class="btn btn-yellow" href="scorecard.html">
        <div class="btn-left"><div class="btn-icon">&#x2699;</div><span>Event Manager</span></div>
        <span class="btn-arrow">&#x2192;</span>
      </a>
      <a class="btn btn-red" href="league.html">
        <div class="btn-left"><div class="btn-icon">&#x26F3;</div><span>Golf League</span></div>
        <span class="btn-arrow">&#x2192;</span>
      </a>
    </div>
    <div class="footer">
      Powered by <a href="https://verotech.ai" target="_blank" rel="noopener">VeroTech.AI</a>
      <span>|</span><span>314-834-7774</span>
    </div>
  </div>
</body>
</html>
