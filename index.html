<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorecard Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:"DM Sans",sans-serif;
      min-height:100vh;
      background:#050e05 url('bg.jpg') center/cover no-repeat fixed;
      color:#e5e7eb;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 16px;
    }
    #launcher{
      display:flex;
      flex-direction:column;
      align-items:center;
      width:100%;
      max-width:600px;
      gap:20px;
    }
    #launcher img{
      width:180px;
      display:block;
      filter:drop-shadow(0 0 16px rgba(34,197,94,.9)) drop-shadow(0 0 36px rgba(34,197,94,.5));
    }
    .title-card{
      width:100%;
      background:rgba(6,14,6,.88);
      backdrop-filter:blur(24px);
      border:1px solid rgba(34,197,94,.35);
      border-radius:20px;
      padding:36px 36px 24px;
      text-align:center;
      box-shadow:0 0 40px rgba(34,197,94,.1),0 20px 60px rgba(0,0,0,.6);
    }
    .sp-title{
      font-family:"Inter",sans-serif;
      font-size:22px;
      font-weight:800;
      letter-spacing:.2em;
      color:#22C55E;
      text-transform:uppercase;
      margin-bottom:6px;
      text-shadow:0 0 20px rgba(34,197,94,.6);
    }
    .sp-sub{
      font-size:11px;
      color:rgba(255,255,255,.35);
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    .btns{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .lbtn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 20px;
      border-radius:13px;
      background:rgba(12,20,12,.92);
      border:1px solid rgba(255,255,255,.08);
      text-decoration:none;
      font-family:"DM Sans",sans-serif;
      font-size:15px;
      font-weight:700;
      color:#e5e7eb;
      transition:border-color .2s,box-shadow .2s,transform .15s;
    }
    .lbtn:hover{
      border-color:rgba(34,197,94,.45);
      box-shadow:0 0 20px rgba(34,197,94,.2);
      transform:translateY(-2px);
    }
    .lbtn-left{display:flex;align-items:center;gap:14px;}
    .lbtn-icon{
      width:42px;height:42px;border-radius:9px;
      background:rgba(34,197,94,.13);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;flex-shrink:0;
    }
    .lbtn-arrow{color:rgba(255,255,255,.35);font-size:18px;}
    .c-green{color:#22c55e;}
    .c-blue{color:#60a5fa;}
    .c-yellow{color:#facc15;}
    .c-red{color:#ef4444;}
    .footer{
      font-size:12px;
      color:rgba(255,255,255,.3);
      display:flex;gap:8px;align-items:center;
    }
    .footer a{color:rgba(34,197,94,.7);text-decoration:none;font-weight:700;}
  </style>
</head>
<body>
  <div id="launcher">
    <img src="logo.png" alt="Scorecard Pro">
    <div class="title-card">
      <div class="sp-title">Tournament Control Panel</div>
      <div class="sp-sub">Live Scores. Real Time. Real Impact.</div>
    </div>
    <div class="btns">
      <a class="lbtn c-green" href="scorecard.html">
        <div class="lbtn-left"><div class="lbtn-icon">&#x26F3;</div><span>Open Scorecard</span></div>
        <span class="lbtn-arrow">&#x2192;</span>
      </a>
      <a class="lbtn c-blue" href="scorecard.html">
        <div class="lbtn-left"><div class="lbtn-icon">&#x1F3C6;</div><span>View Leaderboard</span></div>
        <span class="lbtn-arrow">&#x2192;</span>
      </a>
      <a class="lbtn c-yellow" href="scorecard.html">
        <div class="lbtn-left"><div class="lbtn-icon">&#x2699;</div><span>Event Manager</span></div>
        <span class="lbtn-arrow">&#x2192;</span>
      </a>
      <a class="lbtn c-red" href="league.html">
        <div class="lbtn-left"><div class="lbtn-icon">&#x26F3;</div><span>Golf League</span></div>
        <span class="lbtn-arrow">&#x2192;</span>
      </a>
    </div>
    <div class="footer">
      Powered by <a href="https://verotech.ai" target="_blank" rel="noopener">VeroTech.AI</a>
      <span>|</span><span>314-834-7774</span>
    </div>
  </div>
</body>
</html>
